name: ci

on:
  push:
    branches: [main, "cursor/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerd
          POSTGRES_PASSWORD: ledgerd
          POSTGRES_DB: ledgerd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerd -d ledgerd_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ledgerd:ledgerd@localhost:5432/ledgerd_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false
      - name: ruby client tests
        run: |
          set -euo pipefail
          ruby -v
          ruby -Ilib:test test/client_test.rb | tee ruby_test.out
          echo "---"
          # Count assertions/tests from minitest summary line
          grep -E 'runs,+|assertions' ruby_test.out || true
